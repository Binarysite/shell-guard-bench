name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The whole job takes well under a minute; a hook that ignores its kill must not hold a runner for hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          # Process groups and sh behave differently enough on macOS to test there too.
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:types
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run coverage
      # The anchored toy guard leaks critical cases: exactly exit 1. Exit 0 means the
      # gate missed the leaks; exit 2 means the run itself broke.
      - name: naive guard exits 1
        run: |
          set +e
          npm run bench:naive
          code=$?
          test $code -eq 1
      - name: substring guard exits 0
        run: npm run bench:substring
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: guard-bench-${{ matrix.os }}-node${{ matrix.node }}
          path: reports/naive.json

  # The composite action in action.yml, run the way another repository would run it.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: substring guard passes
        id: substring
        uses: ./
        with:
          hook: node examples/guards/substring.mjs
          out: reports/action-substring.json
      - name: anchored guard fails the gate
        id: anchored
        continue-on-error: true
        uses: ./
        with:
          hook: node examples/guards/anchored-regex.mjs
          out: reports/action-anchored.json
          summary: 'false'
      - name: shell metacharacters in an input stay data
        id: metachar
        uses: ./
        with:
          # If the action pasted inputs into its script, bash would run the $( ) and the backticks.
          hook: 'exit 2 # $(touch injected-dollar) `touch injected-backtick`'
          only: privilege
          out: reports/action-metachar.json
          summary: 'false'
      - name: outputs and exit codes
        env:
          SUB: ${{ steps.substring.outputs.result }}/${{ steps.substring.outputs.exit-code }}
          ANC: ${{ steps.anchored.outputs.result }}/${{ steps.anchored.outputs.exit-code }}
          META: ${{ steps.metachar.outputs.result }}
          REPORT: ${{ steps.substring.outputs.report }}
        run: |
          test "$SUB" = pass/0
          test "$ANC" = fail/1
          test "$META" = pass
          test -s "$REPORT"
          test ! -e injected-dollar && test ! -e injected-backtick
