name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The whole job takes well under a minute; a hook that ignores its kill must not hold a runner for hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          # Process groups and sh behave differently enough on macOS to test there too.
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:types
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run coverage
      # The anchored toy guard leaks critical cases: exactly exit 1. Exit 0 means the
      # gate missed the leaks; exit 2 means the run itself broke.
      - name: naive guard exits 1
        run: |
          set +e
          npm run bench:naive
          code=$?
          test $code -eq 1
      - name: substring guard exits 0
        run: npm run bench:substring
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: guard-bench-${{ matrix.os }}-node${{ matrix.node }}
          path: reports/naive.json
